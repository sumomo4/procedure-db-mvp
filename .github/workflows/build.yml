name: build

on:
  push:
  pull_request:

jobs:
  standard-frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/standard/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
