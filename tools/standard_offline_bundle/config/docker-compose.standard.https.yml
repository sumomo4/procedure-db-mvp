services:
  standard-web:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx.standard.https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/procedure-db/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false

  standard-api:
    environment:
      AUTH_COOKIE_SECURE: "true"
      CORS_ALLOW_ORIGINS: "https://10.58.143.28"
